name: rodauth-ciba-test
services:
  postgres:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: ciba_test
      POSTGRES_PASSWORD: ciba-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciba_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_ROOT_PASSWORD: ciba-test-only
      MYSQL_ROOT_HOST: "%"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      CIBA_TEST_DB: ${CIBA_TEST_DB:-sqlite}
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
